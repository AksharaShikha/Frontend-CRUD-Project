
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>User Management Dashboard</h1>
        <p class="subtitle">Add, view, edit and delete users</p>

        <section class="form-section">
            <h2 id="form-title">Add New User</h2>

            <form id="user-form">
                <input type="hidden" id="user-id">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address" required>

                <button type="submit" id="submit-btn">Add User</button>
                <button type="button" id="cancel-btn" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="users-section">
            
<div class="users-toolbar">
    <div class="users-heading">
        <h2>Users List</h2>
        <span id="user-count">0 users</span>
    </div>

    <input
        type="search"
        id="search-input"
        placeholder="⌕  Search by name or email..."
        aria-label="Search users"
    >
</div>

<p id="status-message" role="status">Loading users...</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-list"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
